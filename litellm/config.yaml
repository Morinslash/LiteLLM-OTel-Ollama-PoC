model_list:
  - model_name: local-chat
    litellm_params:
      model: ollama_chat/qwen3:1.7b
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      supports_function_calling: true
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5

litellm_settings:
  # Format LiteLLM proxy output as JSON.
  json_logs: true
  # Add trace_id and, when provided, session_id to request-related log lines.
  request_correlation_in_logs: true
  # Capture raw provider-facing request and response data for logging integrations.
  # POC ONLY: this can contain prompts, system messages, tool arguments, and outputs.
  log_raw_request_response: true 
  # Forward Claude Code's OAuth Authorization header only when routing to this alias.
  model_group_settings:
    forward_client_headers_to_llm_api:
      - claude-haiku

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Store request messages and completion content in LiteLLM's PostgreSQL spend logs.
  # This is visible in LiteLLM UI → Logs for requests made after it is enabled.
  store_prompts_in_spend_logs: true
