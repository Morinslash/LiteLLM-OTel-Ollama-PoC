services:
  db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro # Read Only volume
    command:
      - "--config=/app/config.yaml"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234} # Admin password for login
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      # Default: the WSL2 gateway IP, for Ollama running natively on the Windows host
      # (see ollama-wsl-networking.md). Set OLLAMA_BASE_URL=http://ollama:11434 in .env
      # instead when running with `--profile with-ollama` (Linux/Docker, no WSL2).
      OLLAMA_BASE_URL: "http://${HOST_GATEWAY_IP}:11434"
      # OpenTelemetry Parameters
      # Enable LiteLLM's current OTel instrumentation.
      LITELLM_OTEL_V2: "true"
      # Export OpenTelemetry data using OTLP over HTTP/protobuf.
      OTEL_EXPORTER: "otlp_http"
      # Internal Compose-network address, not Windows localhost.
      OTEL_ENDPOINT: "http://otel-lgtm:4318"
      # Resource name displayed in Grafana/Tempo.
      OTEL_SERVICE_NAME: "litellm-proxy"
      # Enable OTel GenAI metrics as well as traces, not logs
      LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
      # Enable OpenTelemetry GenAI prompts/responses as span attributes and events, traces only
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "span_and_event"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-lgtm:
    image: docker.io/grafana/otel-lgtm:latest
    container_name: otel-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - otel-lgtm-data:/data
      - ./otel/tempo.yaml:/otel-lgtm/tempo-config.yaml:ro

  # Optional containerised Ollama, for Linux/Docker hosts without the WSL2 gateway-IP
  # networking this repo otherwise assumes. Off by default so the existing Windows +
  # Podman + WSL2 workflow (host-native Ollama) is untouched.
  #
  #   docker compose --profile with-ollama up -d
  #   # then set OLLAMA_BASE_URL=http://ollama:11434 in .env and restart litellm
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen3:1.7b}"]
    restart: "no"

volumes:
  litellm-db-data:
  otel-lgtm-data:
  ollama-data:
