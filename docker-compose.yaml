services:
  db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro # Read Only volume
    command:
      - "--config=/app/config.yaml"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234} # Admin password for login
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      # Enable LiteLLM's current OTel instrumentation.
      LITELLM_OTEL_V2: "true"
      # Export OpenTelemetry data using OTLP over HTTP/protobuf.
      OTEL_EXPORTER: "otlp_http"
      # Internal Compose-network address, not Windows localhost.
      OTEL_ENDPOINT: "http://otel-lgtm:4318"
      # Resource name displayed in Grafana/Tempo.
      OTEL_SERVICE_NAME: "litellm-proxy"
      # Enable OTel GenAI metrics as well as traces.
      LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
      # Host machine IP to reach Ollama
      OLLAMA_BASE_URL: "http://${HOST_GATEWAY_IP}:11434"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-lgtm:
    image: docker.io/grafana/otel-lgtm:latest
    container_name: otel-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - otel-lgtm-data:/data
    
volumes:
  litellm-db-data:
  otel-lgtm-data: